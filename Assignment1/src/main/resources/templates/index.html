<!DOCTYPE html>
<html>
	<head>
	      <meta charset="UTF-8">
	      <title> Voice Record </title>
	    <link rel="stylesheet" type="text/css" th:href="@{css/csstest.css}"/>
	 </head>
	<body> 
		<h1> Voice Record  </h1> 
		
		<div class="container">
			<div class="text-box">
				<p> Hi This is from new things </p>
			</div>
		</div>
		
		<div name="button-pos">
			<div  id="button-record" onclick="startRecording()"> Record </div>
			<div  id="button-recording" class="hidden" onclick="stopRecording()"> 
				<div name="red-circle"></div>
				Recording...
			</div>
		</div>
	</body>
</html>

<script>
	// Get button id
    const recordBtn = document.getElementById("button-record");
    const recordingBtn = document.getElementById("button-recording");
	
	// hide record and show recording
    function startRecording() {
        recordBtn.classList.add("hidden")     
        recordingBtn.classList.remove("hidden");  
    }
	
	// hide recording and show record
    function stopRecording() {
		recordBtn.classList.remove("hidden")      
        recordingBtn.classList.add("hidden");    
    }
</script>
